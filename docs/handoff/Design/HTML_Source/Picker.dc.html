<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose a file</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif; color: {{t.text}}; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 54px 8px 6px">
    <a href="Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{t.text}}"><svg width="22" height="22" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"/></svg></a>
    <span style="font-size: 17px; font-weight: 800">Choose a file</span>
    <button type="button" aria-label="Import from Files" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: {{t.link}}"><svg width="22" height="22" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M216,72H130.67L102.93,51.2a16.12,16.12,0,0,0-9.6-3.2H40A16,16,0,0,0,24,64V200a16,16,0,0,0,16,16H216.89A15.13,15.13,0,0,0,232,200.89V88A16,16,0,0,0,216,72Zm0,128H40V64H93.33L123.2,86.4A8,8,0,0,0,128,88h88Z"/></svg></button>
  </div>

  <div style="padding: 4px 16px 12px">
    <div role="tablist" aria-label="Source" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: {{t.surface2}}; border-radius: 12px">
      <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{tb.sel}}" onClick="{{tb.pick}}" style="height: 34px; border: 0; border-radius: 9px; background: {{tb.bg}}; box-shadow: {{tb.sh}}; font-family: inherit; font-size: 13px; font-weight: {{tb.w}}; color: {{tb.fg}}">{{tb.label}}</button>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{videos}}" hint-placeholder-val="{{ true }}">
    <div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 128px; gap: 2px; align-content: start">
      <sc-for list="{{tiles}}" as="v" hint-placeholder-count="12">
        <button type="button" onClick="{{v.pick}}" aria-label="{{v.label}}" aria-pressed="{{v.pressed}}" style="position: relative; border: 0; padding: 0; margin: 0; background: {{t.surface2}}; overflow: hidden; font-family: inherit">
          <img src="{{v.img}}" alt="" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; opacity: {{v.dim}}">
          <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: linear-gradient(transparent, rgba(0,0,0,0.6))"></span>
          <span style="position: absolute; right: 6px; bottom: 5px; color: #FFFFFF; font-size: 12px; font-weight: 800">{{v.dur}}</span>
          <span style="position: absolute; left: 6px; bottom: 6px; display: flex; color: #FFFFFF"><svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M251.77,73a8,8,0,0,0-8.21.39L208,97.05V72a16,16,0,0,0-16-16H32A16,16,0,0,0,16,72V184a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V159l35.56,23.71A8,8,0,0,0,248,184a8,8,0,0,0,8-8V80A8,8,0,0,0,251.77,73ZM192,184H32V72H192V184Zm48-22.95-32-21.33V116.28L240,95Z"/></svg></span>
          <sc-if value="{{v.on}}" hint-placeholder-val="{{ false }}">
            <span style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; box-sizing: border-box; border: 3px solid {{t.accent}}"></span>
            <span style="position: absolute; right: 6px; top: 6px; width: 24px; height: 24px; border-radius: 12px; background: {{t.accent}}; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 256 256" fill="#FFFFFF" aria-hidden="true"><path d="M232.49,80.49l-128,128a12,12,0,0,1-17,0l-56-56a12,12,0,1,1,17-17L96,183,215.51,63.51a12,12,0,0,1,17,17Z"/></svg></span>
          </sc-if>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{audio}}" hint-placeholder-val="{{ false }}">
    <div style="flex: 1; padding: 0 16px; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{songs}}" as="s" hint-placeholder-count="6">
        <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: {{t.surface}}; border: {{s.border}}; font-family: inherit; color: {{t.text}}; text-align: left">
          <span style="width: 42px; height: 42px; border-radius: 12px; background: {{t.accentSoft}}; color: {{t.accentOnSoft}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M212.92,17.71a7.89,7.89,0,0,0-6.86-1.46l-128,32A8,8,0,0,0,72,56V166.1A36,36,0,1,0,88,196V102.25l112-28V134.1A36,36,0,1,0,216,164V24A8,8,0,0,0,212.92,17.71Z"/></svg></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; font-weight: 700">{{s.name}}</span><span style="font-size: 12px; font-weight: 600; color: {{t.text2}}">{{s.meta}}</span></span>
          <span style="width: 22px; height: 22px; border-radius: 11px; box-sizing: border-box; border: {{s.ring}}; flex: none"></span>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <div style="padding: 12px 16px 32px; background: {{t.tab}}; border-top: 1px solid {{t.divider}}; display: flex; align-items: center; gap: 12px">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 15px; font-weight: 800">{{sumTitle}}</span>
      <span style="font-size: 12px; font-weight: 600; color: {{t.text2}}">{{pickSub}}</span>
    </div>
    <a href="Convert.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 50px; padding: 0 22px; border-radius: 16px; background: {{t.accent}}; color: {{t.accentText}}; font-size: 16px; font-weight: 800; text-decoration: none">Continue<svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224.49,136.49l-72,72a12,12,0,0,1-17-17L187,140H40a12,12,0,0,1,0-24H187L135.51,64.48a12,12,0,0,1,17-17l72,72A12,12,0,0,1,224.49,136.49Z"/></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"tab":{"editor":"enum","options":["videos","audio"],"default":"videos"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: null, pick: 0, song: 0 }; }
  renderVals() {
    const T = {
      light: { name:'light', bg: '#F5F4FA', surface: '#FFFFFF', surface2: '#EEECF6', border: '#E5E2F0', divider: '#EFEDF5', text: '#15132B', text2: '#5C5875', text3: '#6B6784', accent: '#5B3FE6', accentText: '#FFFFFF', accentSoft: '#EEEAFF', accentOnSoft: '#3F25C9', link: '#5B3FE6', success: '#0F7350', successSoft: '#E4F4EC', warn: '#9A5A12', warnSoft: '#FDF0DF', danger: '#C2331F', dangerSoft: '#FDECEA', hero: 'linear-gradient(135deg, #3F25C9 0%, #5B3FE6 55%, #7B4DFF 100%)', heroText: '#FFFFFF', tab: 'rgba(255,255,255,0.94)', toast: '#1C1A2E', shadow: '0 1px 2px rgba(21,19,43,0.05), 0 8px 24px rgba(21,19,43,0.06)', scrim: 'rgba(16,12,40,0.52)', gold: '#E0A21B', proBadgeBg: '#15132B', proBadgeText: '#FFD36B' },
      dark: { name:'dark', bg: '#0E0D16', surface: '#181626', surface2: '#221F33', border: '#2C2942', divider: '#25223A', text: '#F3F1FF', text2: '#ABA7C6', text3: '#8C88A8', accent: '#6F4EF2', accentText: '#FFFFFF', accentSoft: 'rgba(132,102,255,0.18)', accentOnSoft: '#C4B5FF', link: '#B3A1FF', success: '#3CCB8C', successSoft: 'rgba(60,203,140,0.14)', warn: '#F2B25C', warnSoft: 'rgba(242,178,92,0.14)', danger: '#FF7A68', dangerSoft: 'rgba(255,122,104,0.14)', hero: 'linear-gradient(135deg, #3A22BD 0%, #5537E0 55%, #7A4FFF 100%)', heroText: '#FFFFFF', tab: 'rgba(24,22,38,0.94)', toast: '#2E2A48', shadow: '0 1px 2px rgba(0,0,0,0.3)', scrim: 'rgba(0,0,0,0.64)', gold: '#E0A21B', proBadgeBg: '#F3F1FF', proBadgeText: '#3F25C9' }
    };
    const t = T[this.props.theme === 'dark' ? 'dark' : 'light'];
    const clean = !!this.props.clean && this.props.clean !== 'false';

    const tab = this.state.tab ?? this.props.tab ?? 'videos';
    const tabs = [['videos', 'Videos'], ['audio', 'Audio files'], ['recent', 'Recent']].map(([id, label]) => {
      const on = id === tab || (id === 'recent' && false);
      return { label, sel: on ? 'true' : 'false', bg: on ? t.surface : 'transparent', sh: on ? t.shadow : 'none', w: on ? 800 : 600, fg: on ? t.text : t.text2, pick: () => this.setState({ tab: id === 'recent' ? 'videos' : id }) };
    });
    const vids = [['d7ac9491ef6d4e199c5fbf1e2d8bbb4b', '0:42'], ['5230e115aa53f2fe4f1bae4b963f1b53', '3:15'], ['dd64327afe25562e1591f48342e293d5', '1:12'], ['8c521075fc83bb811784b777aa2736b2', '2:04'], ['b83d4fbca9ef70a6ff995b7379fbd814', '4:30'], ['905a454bac2434f6af6d86ab906f3d45', '0:58'],
      ['d198a3fd0fda1b9001534f72a7d393f6', '1:47'], ['5516368f341d205f192745a99e462d07', '0:21'], ['d85af57f969ed0047fce7d7f27af3db4', '2:36'], ['1a0852811dbe690425b6b90df3449d93', '0:33'], ['4b2f41ee46be462fd9e6d3e3e17e8022', '5:02'], ['80cb07a9b616e8406958931c9c0960b2', '1:09']];
    const p = this.state.pick;
    const tiles = vids.map((v, i) => ({ img: '/_blob/' + v[0], dur: v[1], on: i === p, dim: i === p ? 0.85 : 1, pressed: i === p ? 'true' : 'false', label: 'Video, ' + v[1], pick: () => this.setState({ pick: i }) }));
    const sv = [['Summer_mix.wav', 'WAV · 3:42 · 38.1 MB'], ['Voice_memo_12.m4a', 'M4A · 1:05 · 1.1 MB'], ['Guitar_take_3.aiff', 'AIFF · 0:48 · 8.4 MB'], ['Podcast_ep4.mp3', 'MP3 · 42:10 · 58 MB'], ['Lecture_audio.m4a', 'M4A · 55:02 · 52 MB'], ['Beat_loop.flac', 'FLAC · 0:16 · 2.2 MB']];
    const so = this.state.song;
    const songs = sv.map((s, i) => ({ name: s[0], meta: s[1], pressed: i === so ? 'true' : 'false', border: i === so ? '2px solid ' + t.accent : '1px solid ' + t.border, ring: i === so ? '7px solid ' + t.accent : '2px solid ' + t.border, pick: () => this.setState({ song: i }) }));
    const sumTitle = tab === 'audio' ? '1 audio file selected' : '1 video selected · ' + vids[p][1];
    return { t, pickSub: clean ? 'Ready to convert' : 'Batch up to 50 files with Pro', tabs, tiles, songs, videos: tab !== 'audio', audio: tab === 'audio', sumTitle };
  }
}
</script>
</body>
</html>
