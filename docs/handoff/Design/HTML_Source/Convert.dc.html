        </div>
      </div>
      <a href="#" style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 14px; border-radius: 16px; background: {{t.surface}}; border: 1px solid {{t.border}}; text-decoration: none; color: {{t.text}}">
        <span style="display: flex; color: {{t.text2}}"><svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M157.73,113.13A8,8,0,0,1,159.82,102L227.48,55.7a8,8,0,0,1,9,13.21l-67.67,46.3a7.92,7.92,0,0,1-4.51,1.4A8,8,0,0,1,157.73,113.13Zm80.87,85.09a8,8,0,0,1-11.12,2.08L136,137.7,93.49,166.78a36,36,0,1,1-9-13.19L121.83,128,84.44,102.41a35.86,35.86,0,1,1,9-13.19l143,97.87A8,8,0,0,1,238.6,198.22ZM80,180a20,20,0,1,0-5.86,14.14A19.85,19.85,0,0,0,80,180ZM74.14,90.13a20,20,0,1,0-28.28,0A19.85,19.85,0,0,0,74.14,90.13Z"/></svg></span>

        <span style="display: flex; color: {{t.text3}}"><svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M184.49,136.49l-80,80a12,12,0,0,1-17-17L159,128,87.51,56.49a12,12,0,1,1,17-17l80,80A12,12,0,0,1,184.49,136.49Z"/></svg></span>
      </a>

    <sc-if value="{{isTone}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; gap: 8px">
        <sc-for list="{{toneTypes}}" as="y" hint-placeholder-count="3">
          <button type="button" onClick="{{y.pick}}" aria-pressed="{{y.pressed}}" style="flex: 1; height: 40px; border-radius: 14px; border: {{y.border}}; background: {{y.bg}}; font-family: inherit; font-size: 13px; font-weight: 800; color: {{y.fg}}">{{y.label}}</button>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 18px; background: {{t.surface}}; border: 1px solid {{t.border}}">
        <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700"><span style="color: {{t.text2}}">Selected part</span><span>0:08 – 0:38 · 30 s</span></div>
        <div style="position: relative; height: 72px; border-radius: 12px; background: {{t.surface2}}; display: flex; align-items: center; gap: 2px; padding: 0 6px; overflow: hidden">
          <span style="position: absolute; left: 19%; width: 71%; top: 0; bottom: 0; background: {{t.accentSoft}}; border-left: 3px solid {{t.accent}}; border-right: 3px solid {{t.accent}}"></span>
          <sc-for list="{{wave}}" as="w" hint-placeholder-count="44"><span style="position: relative; flex: 1; border-radius: 2px; height: {{w.h}}; background: {{w.c}}"></span></sc-for>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: {{t.text3}}"><span>0:00</span><span>0:21</span><span>0:42</span></div>
        <div style="display: flex; gap: 8px">
          <span style="flex: 1; display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 12px; border-radius: 12px; background: {{t.surface2}}; font-size: 13px; font-weight: 700">Fade in<span style="width: 36px; height: 22px; border-radius: 11px; background: {{t.accent}}; position: relative"><span style="position: absolute; right: 2px; top: 2px; width: 18px; height: 18px; border-radius: 9px; background: #FFFFFF"></span></span></span>
          <span style="flex: 1; display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 12px; border-radius: 12px; background: {{t.surface2}}; font-size: 13px; font-weight: 700">Fade out<span style="width: 36px; height: 22px; border-radius: 11px; background: {{t.accent}}; position: relative"><span style="position: absolute; right: 2px; top: 2px; width: 18px; height: 18px; border-radius: 9px; background: #FFFFFF"></span></span></span>
        </div>
      </div>
      <div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: {{t.accentSoft}}; color: {{t.accentOnSoft}}; font-size: 13px; font-weight: 600; line-height: 1.4">
        <span style="display: flex; flex: none; margin-top: 1px"><svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm16-40a8,8,0,0,1-8,8,16,16,0,0,1-16-16V128a8,8,0,0,1,0-16,16,16,0,0,1,16,16v40A8,8,0,0,1,144,176ZM112,84a12,12,0,1,1,12,12A12,12,0,0,1,112,84Z"/></svg></span>
        iPhone ringtones can be up to 30 seconds. After saving we'll guide you step by step to set it.
      </div>
    </sc-if>
  </div>

  <div style="padding: 12px 20px 32px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700"><span style="color: {{t.text2}}">{{sumLeft}}</span><span style="color: {{t.success}}">{{sumRight}}</span></div>
    <a href="Result.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border-radius: 16px; background: {{t.accent}}; color: {{t.accentText}}; font-size: 17px; font-weight: 800; text-decoration: none">{{cta}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"mode":{"editor":"enum","options":["audio","ringtone"],"default":"audio"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: null, fmt: 0, q: 1, tone: 0 }; }
  renderVals() {
    const T = {
      light: { name:'light', bg: '#F5F4FA', surface: '#FFFFFF', surface2: '#EEECF6', border: '#E5E2F0', divider: '#EFEDF5', text: '#15132B', text2: '#5C5875', text3: '#6B6784', accent: '#5B3FE6', accentText: '#FFFFFF', accentSoft: '#EEEAFF', accentOnSoft: '#3F25C9', link: '#5B3FE6', success: '#0F7350', successSoft: '#E4F4EC', warn: '#9A5A12', warnSoft: '#FDF0DF', danger: '#C2331F', dangerSoft: '#FDECEA', hero: 'linear-gradient(135deg, #3F25C9 0%, #5B3FE6 55%, #7B4DFF 100%)', heroText: '#FFFFFF', tab: 'rgba(255,255,255,0.94)', toast: '#1C1A2E', shadow: '0 1px 2px rgba(21,19,43,0.05), 0 8px 24px rgba(21,19,43,0.06)', scrim: 'rgba(16,12,40,0.52)', gold: '#E0A21B', proBadgeBg: '#15132B', proBadgeText: '#FFD36B' },
      dark: { name:'dark', bg: '#0E0D16', surface: '#181626', surface2: '#221F33', border: '#2C2942', divider: '#25223A', text: '#F3F1FF', text2: '#ABA7C6', text3: '#8C88A8', accent: '#6F4EF2', accentText: '#FFFFFF', accentSoft: 'rgba(132,102,255,0.18)', accentOnSoft: '#C4B5FF', link: '#B3A1FF', success: '#3CCB8C', successSoft: 'rgba(60,203,140,0.14)', warn: '#F2B25C', warnSoft: 'rgba(242,178,92,0.14)', danger: '#FF7A68', dangerSoft: 'rgba(255,122,104,0.14)', hero: 'linear-gradient(135deg, #3A22BD 0%, #5537E0 55%, #7A4FFF 100%)', heroText: '#FFFFFF', tab: 'rgba(24,22,38,0.94)', toast: '#2E2A48', shadow: '0 1px 2px rgba(0,0,0,0.3)', scrim: 'rgba(0,0,0,0.64)', gold: '#E0A21B', proBadgeBg: '#F3F1FF', proBadgeText: '#3F25C9' }
    };
    const t = T[this.props.theme === 'dark' ? 'dark' : 'light'];
    const clean = !!this.props.clean && this.props.clean !== 'false';

    const mode = this.state.mode ?? this.props.mode ?? 'audio';
    const seg = (on) => ({ bg: on ? t.surface : 'transparent', sh: on ? t.shadow : 'none', w: on ? 800 : 600, fg: on ? t.text : t.text2, sel: on ? 'true' : 'false' });
    const modes = [['audio', 'Audio file'], ['ringtone', 'Ringtone']].map(([id, label]) => ({ label, ...seg(id === mode), pick: () => this.setState({ mode: id }) }));
    const F = clean ? [['MP3', false], ['M4A', false], ['WAV', false], ['FLAC', false], ['AAC', false], ['OGG', false]] : [['MP3', false], ['M4A', false], ['WAV', false], ['FLAC', true], ['AAC', true], ['OGG', true]];
    const formats = F.map((f, i) => {
      const on = i === this.state.fmt;
      return { label: f[0], pro: f[1], pressed: on ? 'true' : 'false', border: on ? '2px solid ' + t.accent : '1px solid ' + t.border, bg: on ? t.accentSoft : t.surface, fg: on ? t.accentOnSoft : t.text, pick: () => this.setState({ fmt: i }) };
    });
    const Q = [['Standard', '128 kbps · voice, podcasts', '~0.7 MB'], ['High', '256 kbps · music (recommended)', '~1.3 MB'], ['Best', '320 kbps · same as the original', '~1.7 MB']];
    const qualities = Q.map((q, i) => {
      const on = i === this.state.q;
      return { name: q[0], desc: q[1], size: q[2], sel: on ? 'true' : 'false', border: on ? '2px solid ' + t.accent : '1px solid ' + t.border, ring: on ? '7px solid ' + t.accent : '2px solid ' + t.border, pick: () => this.setState({ q: i }) };
    });
    const toneTypes = ['Ringtone', 'Alarm', 'Text tone'].map((l, i) => {
      const on = i === this.state.tone;
      return { label: l, pressed: on ? 'true' : 'false', border: on ? '2px solid ' + t.accent : '1px solid ' + t.border, bg: on ? t.accentSoft : t.surface, fg: on ? t.accentOnSoft : t.text, pick: () => this.setState({ tone: i }) };
    });
    const WH = [10, 18, 26, 14, 34, 22, 40, 28, 16, 44, 30, 20, 36, 48, 26, 18, 40, 52, 34, 22, 46, 38, 24, 16, 42, 30, 20, 50, 36, 26, 18, 44, 32, 22, 14, 38, 28, 18, 12, 26, 16, 10, 20, 12];
    const wave = WH.map((h, i) => ({ h: h + 'px', c: (i >= 8 && i <= 39) ? t.accent : t.text3 }));
    const fm = F[this.state.fmt][0];
    const isAudio = mode === 'audio';
    return {
      t, modes, formats, qualities, toneTypes, wave, isAudio, isTone: !isAudio,
      title: isAudio ? 'Convert to audio' : 'Make a ringtone',
      sumLeft: isAudio ? fm + ' · ' + ['128', '256', '320'][this.state.q] + ' kbps · 0:42' : 'M4R ringtone · 30 s',
      sumRight: isAudio ? Q[this.state.q][2] + ' (from 86 MB)' : 'Ready for iPhone',
      cta: isAudio ? 'Convert to ' + fm : 'Create ringtone'
    };
  }
}
</script>
