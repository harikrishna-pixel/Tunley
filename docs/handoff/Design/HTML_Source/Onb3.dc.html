<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How often</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif; color: {{t.text}}; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 58px 20px 0; height: 44px">
    <div aria-hidden="true" style="display: flex; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{t.border}}"></span><span style="width: 6px; height: 6px; border-radius: 3px; background: {{t.border}}"></span><span style="width: 22px; height: 6px; border-radius: 3px; background: {{t.accent}}"></span><span style="width: 6px; height: 6px; border-radius: 3px; background: {{t.border}}"></span><span style="width: 6px; height: 6px; border-radius: 3px; background: {{t.border}}"></span></div>
    <a href="Paywall.dc.html" style="font-size: 15px; font-weight: 700; color: {{t.text2}}; text-decoration: none">Skip</a>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; padding: 28px 24px 0; gap: 22px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.12">How often will you use Tunely?</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.5; color: {{t.text2}}">So we only suggest what's worth it for you.</p>
    </div>
    <div role="radiogroup" aria-label="Frequency" style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{o.sel}}" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 14px; height: 68px; padding: 0 18px; border-radius: 20px; border: {{o.border}}; background: {{t.surface}}; font-family: inherit; color: {{t.text}}; text-align: left">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 800">{{o.title}}</span><span style="font-size: 13px; font-weight: 600; color: {{t.text2}}">{{o.sub}}</span></span>
          <span style="width: 24px; height: 24px; border-radius: 12px; box-sizing: border-box; border: {{o.ring}}; flex: none"></span>
        </button>
      </sc-for>
    </div>
  </div>
  <div style="padding: 12px 24px 34px">
    <a href="Onb4.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: {{t.accent}}; color: {{t.accentText}}; font-size: 17px; font-weight: 800; text-decoration: none">Continue</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pick: 1 }; }
  renderVals() {
    const T = {
      light: { name:'light', bg: '#F5F4FA', surface: '#FFFFFF', surface2: '#EEECF6', border: '#E5E2F0', divider: '#EFEDF5', text: '#15132B', text2: '#5C5875', text3: '#6B6784', accent: '#5B3FE6', accentText: '#FFFFFF', accentSoft: '#EEEAFF', accentOnSoft: '#3F25C9', link: '#5B3FE6', success: '#0F7350', successSoft: '#E4F4EC', warn: '#9A5A12', warnSoft: '#FDF0DF', danger: '#C2331F', dangerSoft: '#FDECEA', hero: 'linear-gradient(135deg, #3F25C9 0%, #5B3FE6 55%, #7B4DFF 100%)', heroText: '#FFFFFF', tab: 'rgba(255,255,255,0.94)', toast: '#1C1A2E', shadow: '0 1px 2px rgba(21,19,43,0.05), 0 8px 24px rgba(21,19,43,0.06)', scrim: 'rgba(16,12,40,0.52)', gold: '#E0A21B', proBadgeBg: '#15132B', proBadgeText: '#FFD36B' },
      dark: { name:'dark', bg: '#0E0D16', surface: '#181626', surface2: '#221F33', border: '#2C2942', divider: '#25223A', text: '#F3F1FF', text2: '#ABA7C6', text3: '#8C88A8', accent: '#6F4EF2', accentText: '#FFFFFF', accentSoft: 'rgba(132,102,255,0.18)', accentOnSoft: '#C4B5FF', link: '#B3A1FF', success: '#3CCB8C', successSoft: 'rgba(60,203,140,0.14)', warn: '#F2B25C', warnSoft: 'rgba(242,178,92,0.14)', danger: '#FF7A68', dangerSoft: 'rgba(255,122,104,0.14)', hero: 'linear-gradient(135deg, #3A22BD 0%, #5537E0 55%, #7A4FFF 100%)', heroText: '#FFFFFF', tab: 'rgba(24,22,38,0.94)', toast: '#2E2A48', shadow: '0 1px 2px rgba(0,0,0,0.3)', scrim: 'rgba(0,0,0,0.64)', gold: '#E0A21B', proBadgeBg: '#F3F1FF', proBadgeText: '#3F25C9' }
    };
    const t = T[this.props.theme === 'dark' ? 'dark' : 'light'];
    const clean = !!this.props.clean && this.props.clean !== 'false';

    const O = [['Every day', 'Music, clips and ringtones all the time'], ['A few times a week', 'Whenever something catches my ear'], ['Just once in a while', 'A ringtone or a file now and then']];
    const opts = O.map((o, i) => { const on = i === this.state.pick; return { t,  title: o[0], sub: o[1], sel: on ? 'true' : 'false', border: on ? '2px solid ' + t.accent : '1px solid ' + t.border, ring: on ? '7px solid ' + t.accent : '2px solid ' + t.border, pick: () => this.setState({ pick: i }) }; });
    return { t,  opts };
  }
}
</script>
</body>
</html>
