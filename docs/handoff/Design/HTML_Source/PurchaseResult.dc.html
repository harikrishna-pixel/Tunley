<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Purchase result</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif; color: {{t.text}}; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <dc-import name="Paywall" theme="{{t.name}}" hint-size="390px,844px"></dc-import>
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: {{t.scrim}}; backdrop-filter: blur(10px) saturate(0.9); -webkit-backdrop-filter: blur(10px) saturate(0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 26px; box-sizing: border-box">
    <div role="tablist" aria-label="Preview state" style="display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: rgba(255,255,255,0.14)">
      <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="5"><button type="button" onClick="{{tb.pick}}" style="height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: {{tb.bg}}; font-family: inherit; font-size: 12px; font-weight: 700; color: {{tb.fg}}">{{tb.label}}</button></sc-for>
    </div>
    <div role="alertdialog" aria-label="{{title}}" style="width: 100%; background: {{t.surface}}; border-radius: 24px; padding: 24px 22px 14px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
      <span style="width: 64px; height: 64px; border-radius: 32px; background: {{iconBg}}; display: flex; align-items: center; justify-content: center">
        <sc-if value="{{failed}}" hint-placeholder-val="{{ true }}"><svg width="30" height="30" viewBox="0 0 256 256" fill="{{t.danger}}" aria-hidden="true"><path d="M224,48H32A16,16,0,0,0,16,64V192a16,16,0,0,0,16,16H224a16,16,0,0,0,16-16V64A16,16,0,0,0,224,48Zm0,16V88H32V64Zm0,128H32V104H224v88Zm-16-24a8,8,0,0,1-8,8H168a8,8,0,0,1,0-16h32A8,8,0,0,1,208,168Zm-64,0a8,8,0,0,1-8,8H120a8,8,0,0,1,0-16h16A8,8,0,0,1,144,168Z"/></svg></sc-if><sc-if value="{{restored}}" hint-placeholder-val="{{ false }}"><svg width="30" height="30" viewBox="0 0 256 256" fill="{{t.success}}" aria-hidden="true"><path d="M232.49,80.49l-128,128a12,12,0,0,1-17,0l-56-56a12,12,0,1,1,17-17L96,183,215.51,63.51a12,12,0,0,1,17,17Z"/></svg></sc-if><sc-if value="{{pending}}" hint-placeholder-val="{{ false }}"><svg width="30" height="30" viewBox="0 0 256 256" fill="{{t.warn}}" aria-hidden="true"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm64-88a8,8,0,0,1-8,8H128a8,8,0,0,1-8-8V72a8,8,0,0,1,16,0v48h48A8,8,0,0,1,192,128Z"/></svg></sc-if><sc-if value="{{none}}" hint-placeholder-val="{{ false }}"><svg width="30" height="30" viewBox="0 0 256 256" fill="{{t.text2}}" aria-hidden="true"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm16-40a8,8,0,0,1-8,8,16,16,0,0,1-16-16V128a8,8,0,0,1,0-16,16,16,0,0,1,16,16v40A8,8,0,0,1,144,176ZM112,84a12,12,0,1,1,12,12A12,12,0,0,1,112,84Z"/></svg></sc-if><sc-if value="{{offline}}" hint-placeholder-val="{{ false }}"><svg width="30" height="30" viewBox="0 0 256 256" fill="{{t.text2}}" aria-hidden="true"><path d="M213.92,210.62a8,8,0,1,1-11.84,10.76l-52-57.15a60,60,0,0,0-57.41,7.24,8,8,0,1,1-9.42-12.93A75.43,75.43,0,0,1,128,144c1.28,0,2.55,0,3.82.1L104.9,114.49A108,108,0,0,0,61,135.31,8,8,0,0,1,49.73,134,8,8,0,0,1,51,122.77a124.27,124.27,0,0,1,41.71-21.66L69.37,75.4a155.43,155.43,0,0,0-40.29,24A8,8,0,0,1,18.92,87,171.87,171.87,0,0,1,58,62.86L42.08,45.38A8,8,0,1,1,53.92,34.62ZM128,192a12,12,0,1,0,12,12A12,12,0,0,0,128,192ZM237.08,87A172.3,172.3,0,0,0,106,49.4a8,8,0,1,0,2,15.87A158.33,158.33,0,0,1,128,64a156.25,156.25,0,0,1,98.92,35.37A8,8,0,0,0,237.08,87ZM195,135.31a8,8,0,0,0,11.24-1.3,8,8,0,0,0-1.3-11.24,124.25,124.25,0,0,0-51.73-24.2A8,8,0,1,0,150,114.24,108.12,108.12,0,0,1,195,135.31Z"/></svg></sc-if>
      </span>
      <h2 style="margin: 0; font-size: 21px; font-weight: 800">{{title}}</h2>
      <p style="margin: 0; font-size: 14px; line-height: 1.45; color: {{t.text2}}">{{body}}</p>
      <div style="width: 100%; padding: 10px 12px; box-sizing: border-box; border-radius: 12px; background: {{t.surface2}}; font-size: 13px; font-weight: 600; color: {{t.text2}}">{{note}}</div>
      <button type="button" style="width: 100%; height: 50px; margin-top: 4px; border: 0; border-radius: 14px; background: {{t.accent}}; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 800">{{cta}}</button>
      <button type="button" style="height: 42px; border: 0; background: transparent; font-family: inherit; font-size: 15px; font-weight: 700; color: {{t.text2}}">{{secondary}}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "state": {"editor": "enum", "options": ["failed", "restored", "pending", "none", "offline"], "default": "failed"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: null }; }
  renderVals() {
    const T = {
      light: { name:'light', bg: '#F5F4FA', surface: '#FFFFFF', surface2: '#EEECF6', border: '#E5E2F0', divider: '#EFEDF5', text: '#15132B', text2: '#5C5875', text3: '#6B6784', accent: '#5B3FE6', accentText: '#FFFFFF', accentSoft: '#EEEAFF', accentOnSoft: '#3F25C9', link: '#5B3FE6', success: '#0F7350', successSoft: '#E4F4EC', warn: '#9A5A12', warnSoft: '#FDF0DF', danger: '#C2331F', dangerSoft: '#FDECEA', hero: 'linear-gradient(135deg, #3F25C9 0%, #5B3FE6 55%, #7B4DFF 100%)', heroText: '#FFFFFF', tab: 'rgba(255,255,255,0.94)', toast: '#1C1A2E', shadow: '0 1px 2px rgba(21,19,43,0.05), 0 8px 24px rgba(21,19,43,0.06)', scrim: 'rgba(16,12,40,0.52)', gold: '#E0A21B', proBadgeBg: '#15132B', proBadgeText: '#FFD36B' },
      dark: { name:'dark', bg: '#0E0D16', surface: '#181626', surface2: '#221F33', border: '#2C2942', divider: '#25223A', text: '#F3F1FF', text2: '#ABA7C6', text3: '#8C88A8', accent: '#6F4EF2', accentText: '#FFFFFF', accentSoft: 'rgba(132,102,255,0.18)', accentOnSoft: '#C4B5FF', link: '#B3A1FF', success: '#3CCB8C', successSoft: 'rgba(60,203,140,0.14)', warn: '#F2B25C', warnSoft: 'rgba(242,178,92,0.14)', danger: '#FF7A68', dangerSoft: 'rgba(255,122,104,0.14)', hero: 'linear-gradient(135deg, #3A22BD 0%, #5537E0 55%, #7A4FFF 100%)', heroText: '#FFFFFF', tab: 'rgba(24,22,38,0.94)', toast: '#2E2A48', shadow: '0 1px 2px rgba(0,0,0,0.3)', scrim: 'rgba(0,0,0,0.64)', gold: '#E0A21B', proBadgeBg: '#F3F1FF', proBadgeText: '#3F25C9' }
    };
    const t = T[this.props.theme === 'dark' ? 'dark' : 'light'];
    const clean = !!this.props.clean && this.props.clean !== 'false';

    const mode = this.state.mode ?? this.props.state ?? 'failed';
    const C = {
      failed: ['Purchase didn’t go through', 'The App Store declined the payment. You haven’t been charged.', 'Check your payment method in Settings › Apple Account › Payment.', 'Try again', 'Contact support', t.dangerSoft],
      restored: ['Pro restored', 'Welcome back! Your Yearly plan is active on this iPhone.', 'Renews Oct 27, 2027 · manage in Settings › Apple Account › Subscriptions', 'Continue', 'View plan details', t.successSoft],
      none: ['No purchases found', 'We couldn’t find Tunely Pro on this Apple Account.', 'Bought it with a different Apple Account? Sign in with it in Settings › Apple Account, then try again.', 'OK', 'Contact support', t.surface2],
      offline: ['You’re offline', 'Connect to the internet to buy or restore Pro. You haven’t been charged.', 'Converting still works without internet.', 'Try again', 'Not now', t.surface2],
      pending: ['Waiting for approval', 'Ask to Buy sent a request to your family organiser. Pro unlocks as soon as they approve.', 'You can keep using Tunely Free meanwhile.', 'OK', 'Restore purchases', t.warnSoft]
    }[mode];
    const tabs = [['failed', 'Failed'], ['restored', 'Restored'], ['pending', 'Pending'], ['none', 'None'], ['offline', 'Offline']].map(([id, label]) => ({ label, bg: id === mode ? t.surface : 'transparent', fg: id === mode ? t.text : '#FFFFFF', pick: () => this.setState({ mode: id }) }));
    return { t,  title: C[0], body: C[1], note: C[2], cta: C[3], secondary: C[4], iconBg: C[5], tabs, failed: mode === 'failed', restored: mode === 'restored', pending: mode === 'pending', none: mode === 'none', offline: mode === 'offline' };
  }
}
</script>
</body>
</html>
