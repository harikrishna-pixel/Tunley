<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your preferences</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif; color: {{t.text}}; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 54px 8px 4px">
    <a href="Settings.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{t.text}}"><svg width="22" height="22" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"/></svg></a>
    <span style="font-size: 17px; font-weight: 800">Your preferences</span>
    <span style="width: 44px"></span>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 8px 20px 0">
    <span style="font-size: 13px; font-weight: 700; color: {{t.text2}}">What do you make most?</span>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{goals}}" as="o" hint-placeholder-count="3">
        <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.sel}}" style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 14px; border-radius: 16px; border: {{o.border}}; background: {{t.surface}}; font-family: inherit; color: {{t.text}}; text-align: left"><span style="flex: 1; font-size: 15px; font-weight: 700">{{o.label}}</span><span style="width: 22px; height: 22px; border-radius: 11px; box-sizing: border-box; border: {{o.ring}}"></span></button>
      </sc-for>
    </div>
    <span style="font-size: 13px; font-weight: 700; color: {{t.text2}}; padding-top: 6px">How often?</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{freqs}}" as="o" hint-placeholder-count="3">
        <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.sel}}" style="height: 44px; border-radius: 14px; border: {{o.border}}; background: {{o.bg}}; font-family: inherit; font-size: 13px; font-weight: 800; color: {{o.fg}}">{{o.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; gap: 10px; align-items: flex-start; margin-top: 6px; padding: 12px 14px; border-radius: 14px; background: {{t.accentSoft}}; color: {{t.accentOnSoft}}; font-size: 13px; font-weight: 600; line-height: 1.45">
      <span style="display: flex; flex: none; margin-top: 1px"><svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm16-40a8,8,0,0,1-8,8,16,16,0,0,1-16-16V128a8,8,0,0,1,0-16,16,16,0,0,1,16,16v40A8,8,0,0,1,144,176ZM112,84a12,12,0,1,1,12,12A12,12,0,0,1,112,84Z"/></svg></span>
      Your choice decides which tool is first on Home and the default settings for new conversions.
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { goal: 0, freq: 1 }; }
  renderVals() {
    const T = {
      light: { name:'light', bg: '#F5F4FA', surface: '#FFFFFF', surface2: '#EEECF6', border: '#E5E2F0', divider: '#EFEDF5', text: '#15132B', text2: '#5C5875', text3: '#6B6784', accent: '#5B3FE6', accentText: '#FFFFFF', accentSoft: '#EEEAFF', accentOnSoft: '#3F25C9', link: '#5B3FE6', success: '#0F7350', successSoft: '#E4F4EC', warn: '#9A5A12', warnSoft: '#FDF0DF', danger: '#C2331F', dangerSoft: '#FDECEA', hero: 'linear-gradient(135deg, #3F25C9 0%, #5B3FE6 55%, #7B4DFF 100%)', heroText: '#FFFFFF', tab: 'rgba(255,255,255,0.94)', toast: '#1C1A2E', shadow: '0 1px 2px rgba(21,19,43,0.05), 0 8px 24px rgba(21,19,43,0.06)', scrim: 'rgba(16,12,40,0.52)', gold: '#E0A21B', proBadgeBg: '#15132B', proBadgeText: '#FFD36B' },
      dark: { name:'dark', bg: '#0E0D16', surface: '#181626', surface2: '#221F33', border: '#2C2942', divider: '#25223A', text: '#F3F1FF', text2: '#ABA7C6', text3: '#8C88A8', accent: '#6F4EF2', accentText: '#FFFFFF', accentSoft: 'rgba(132,102,255,0.18)', accentOnSoft: '#C4B5FF', link: '#B3A1FF', success: '#3CCB8C', successSoft: 'rgba(60,203,140,0.14)', warn: '#F2B25C', warnSoft: 'rgba(242,178,92,0.14)', danger: '#FF7A68', dangerSoft: 'rgba(255,122,104,0.14)', hero: 'linear-gradient(135deg, #3A22BD 0%, #5537E0 55%, #7A4FFF 100%)', heroText: '#FFFFFF', tab: 'rgba(24,22,38,0.94)', toast: '#2E2A48', shadow: '0 1px 2px rgba(0,0,0,0.3)', scrim: 'rgba(0,0,0,0.64)', gold: '#E0A21B', proBadgeBg: '#F3F1FF', proBadgeText: '#3F25C9' }
    };
    const t = T[this.props.theme === 'dark' ? 'dark' : 'light'];
    const clean = !!this.props.clean && this.props.clean !== 'false';

    const G = ['Ringtones, alarms and text tones', 'MP3 from videos', 'Converting audio files'];
    const goals = G.map((l, i) => { const on = i === this.state.goal; return { t,  label: l, sel: on ? 'true' : 'false', border: on ? '2px solid ' + t.accent : '1px solid ' + t.border, ring: on ? '7px solid ' + t.accent : '2px solid ' + t.border, pick: () => this.setState({ goal: i }) }; });
    const freqs = ['Daily', 'Weekly', 'Rarely'].map((l, i) => { const on = i === this.state.freq; return { t,  label: l, sel: on ? 'true' : 'false', border: on ? '2px solid ' + t.accent : '1px solid ' + t.border, bg: on ? t.accentSoft : t.surface, fg: on ? t.accentOnSoft : t.text, pick: () => this.setState({ freq: i }) }; });
    return { t,  goals, freqs };
  }
}
</script>
</body>
</html>
