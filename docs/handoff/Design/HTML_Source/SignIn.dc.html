<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--accent)}
</style>
</helmet>
<div style="--accent: {{t.accent}}; width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif; color: {{t.text}}; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 12px 4px">
    <a href="ReferralSignedOut.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{t.text}}">
      <svg width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg>
    </a>
    <div role="radiogroup" aria-label="Preview state" style="display: flex; gap: 4px; padding: 3px; background: {{t.surface2}}; border-radius: 10px">
      <button type="button" onClick="{{showNormal}}" style="height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: {{normalBg}}; font-family: inherit; font-size: 12px; font-weight: 700; color: {{t.text}}">Normal</button>
      <button type="button" onClick="{{showError}}" style="height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: {{errorBg}}; font-family: inherit; font-size: 12px; font-weight: 700; color: {{t.text}}">Error</button>
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 8px 24px 0">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Welcome back</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.45; color: {{t.text2}}">Sign in to see your invite link and free weeks.</p>
    </div>

    <sc-if value="{{isError}}" hint-placeholder-val="{{ false }}">
      <div role="alert" style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 14px; background: {{t.dangerSoft}}; font-size: 14px; line-height: 1.4; color: {{t.danger}}">
        <span style="display: flex; flex: none; margin-top: 1px"><svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm-8-80V80a8,8,0,0,1,16,0v56a8,8,0,0,1-16,0Zm20,36a12,12,0,1,1-12-12A12,12,0,0,1,140,172Z"></path></svg></span>
        Email or password is incorrect. Try again or reset your password.
      </div>
    </sc-if>

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: {{t.text2}}">Email</span>
      <input type="email" autocomplete="email" value="anna@example.com" style="height: 50px; padding: 0 14px; border-radius: 14px; border: 1px solid {{t.border}}; background: {{t.surface}}; font-family: inherit; font-size: 16px; color: {{t.text}}; outline: none">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: {{t.text2}}">Password</span>
      <input type="password" autocomplete="current-password" value="password1" style="height: 50px; padding: 0 14px; border-radius: 14px; border: 2px solid {{pwBorder}}; background: {{t.surface}}; font-family: inherit; font-size: 16px; color: {{t.text}}; outline: none">
    </label>
    <a href="ForgotPassword.dc.html" style="align-self: flex-end; height: 32px; display: flex; align-items: center; font-size: 14px; font-weight: 600; text-decoration: none">Forgot password?</a>
  </div>

  <div style="padding: 12px 24px 30px; display: flex; flex-direction: column; gap: 12px">
    <a href="Referral.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: {{t.accent}}; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none">Sign in</a>
    <p style="margin: 0; font-size: 14px; color: {{t.text2}}; text-align: center">New here? <a href="SignUp.dc.html" style="font-weight: 700; text-decoration: none">Create a free account</a></p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"state":{"editor":"enum","options":["normal","error"],"default":"normal"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: null };
  }
  renderVals() {
    const T = {
      light: { name:'light', bg: '#F5F4FA', surface: '#FFFFFF', surface2: '#EEECF6', border: '#E5E2F0', divider: '#EFEDF5', text: '#15132B', text2: '#5C5875', text3: '#6B6784', accent: '#5B3FE6', accentText: '#FFFFFF', accentSoft: '#EEEAFF', accentOnSoft: '#3F25C9', link: '#5B3FE6', success: '#0F7350', successSoft: '#E4F4EC', warn: '#9A5A12', warnSoft: '#FDF0DF', danger: '#C2331F', dangerSoft: '#FDECEA', hero: 'linear-gradient(135deg, #3F25C9 0%, #5B3FE6 55%, #7B4DFF 100%)', heroText: '#FFFFFF', tab: 'rgba(255,255,255,0.94)', toast: '#1C1A2E', shadow: '0 1px 2px rgba(21,19,43,0.05), 0 8px 24px rgba(21,19,43,0.06)', scrim: 'rgba(16,12,40,0.52)', gold: '#E0A21B', proBadgeBg: '#15132B', proBadgeText: '#FFD36B' },
      dark: { name:'dark', bg: '#0E0D16', surface: '#181626', surface2: '#221F33', border: '#2C2942', divider: '#25223A', text: '#F3F1FF', text2: '#ABA7C6', text3: '#8C88A8', accent: '#6F4EF2', accentText: '#FFFFFF', accentSoft: 'rgba(132,102,255,0.18)', accentOnSoft: '#C4B5FF', link: '#B3A1FF', success: '#3CCB8C', successSoft: 'rgba(60,203,140,0.14)', warn: '#F2B25C', warnSoft: 'rgba(242,178,92,0.14)', danger: '#FF7A68', dangerSoft: 'rgba(255,122,104,0.14)', hero: 'linear-gradient(135deg, #3A22BD 0%, #5537E0 55%, #7A4FFF 100%)', heroText: '#FFFFFF', tab: 'rgba(24,22,38,0.94)', toast: '#2E2A48', shadow: '0 1px 2px rgba(0,0,0,0.3)', scrim: 'rgba(0,0,0,0.64)', gold: '#E0A21B', proBadgeBg: '#F3F1FF', proBadgeText: '#3F25C9' }
    };
    const t = T[this.props.theme === 'dark' ? 'dark' : 'light'];

    const accent = t.accent;
    const mode = this.state.mode ?? this.props.state ?? 'normal';
    const isError = mode === 'error';
    return { t, 
      accent, isError,
      pwBorder: isError ? t.danger : t.border,
      normalBg: isError ? 'transparent' : t.surface,
      errorBg: isError ? t.surface : 'transparent',
      showNormal: () => this.setState({ mode: 'normal' }),
      showError: () => this.setState({ mode: 'error' })
    };
  }
}
</script>
</body>
</html>
