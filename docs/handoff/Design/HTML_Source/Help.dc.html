<!doctype html>

<x-dc>

    <div style="display: flex; flex-direction: column; border-radius: 18px; background: {{t.surface}}; border: 1px solid {{t.border}}; overflow: hidden">
      <sc-for list="{{faqs}}" as="f" hint-placeholder-count="7">
        <div style="border-bottom: 1px solid {{t.divider}}">
          <button type="button" onClick="{{f.toggle}}" aria-expanded="{{f.ex}}" style="width: 100%; min-height: 52px; padding: 12px 16px; border: 0; background: transparent; font-family: inherit; display: flex; align-items: center; gap: 12px; text-align: left; color: {{t.text}}"><span style="flex: 1; font-size: 15px; font-weight: 700; line-height: 1.3">{{f.q}}</span><span style="display: flex; transform: {{f.rot}}"><svg width="16" height="16" viewBox="0 0 256 256" fill="{{t.text2}}" aria-hidden="true"><path d="M216.49,104.49l-80,80a12,12,0,0,1-17,0l-80-80a12,12,0,0,1,17-17L128,159l71.51-71.52a12,12,0,0,1,17,17Z"/></svg></span></button>
          <sc-if value="{{f.open}}" hint-placeholder-val="{{ false }}"><div style="padding: 0 16px 14px; font-size: 14px; line-height: 1.5; color: {{t.text2}}">{{f.a}}</div></sc-if>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="padding: 12px 20px 34px"><a href="#" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: 16px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font-size: 16px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M128,24A104,104,0,0,0,36.18,176.88L24.83,210.93a16,16,0,0,0,20.24,20.24l34.05-11.35A104,104,0,1,0,128,24Zm0,192a87.87,87.87,0,0,1-44.06-11.81,8,8,0,0,0-6.54-.67L40,216,52.47,178.6a8,8,0,0,0-.66-6.54A88,88,0,1,1,128,216Z"/></svg>Contact support</a></div>
</div>
</x-dc>

</body>
</html>
