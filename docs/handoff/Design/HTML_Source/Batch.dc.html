<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Batch convert</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif; color: {{t.text}}; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 54px 8px 4px">
    <a href="Picker.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{t.text}}"><svg width="22" height="22" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"/></svg></a>
    <span style="font-size: 17px; font-weight: 800">Batch convert</span>
    <span style="width: 44px"></span>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 6px 20px 0">
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 20px; background: {{t.surface}}; border: 1px solid {{t.border}}">
      <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: {{t.text2}}"><span>3 of 8 done · MP3 256 kbps</span><span>about 20 s left</span></div>
      <div style="height: 10px; border-radius: 5px; background: {{t.surface2}}"><div style="width: 44%; height: 100%; border-radius: 5px; background: {{t.accent}}"></div></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{items}}" as="i" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; background: {{t.surface}}; border: {{i.border}}">
          <img src="{{i.img}}" alt="" style="width: 44px; height: 44px; border-radius: 12px; object-fit: cover; flex: none">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="font-size: 14px; font-weight: 700">{{i.name}}</span><span style="font-size: 12px; font-weight: 600; color: {{t.text2}}">{{i.meta}}</span></span>
          <sc-if value="{{i.done}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 256 256" fill="{{t.success}}" aria-hidden="true"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm45.66,85.66-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35a8,8,0,0,1,11.32,11.32Z"/></svg></sc-if>
          <sc-if value="{{i.active}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; font-weight: 800; color: {{t.link}}">62%</span></sc-if>
          <sc-if value="{{i.wait}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 256 256" fill="{{t.text3}}" aria-hidden="true"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm64-88a8,8,0,0,1-8,8H128a8,8,0,0,1-8-8V72a8,8,0,0,1,16,0v48h48A8,8,0,0,1,192,128Z"/></svg></sc-if>
        </div>
      </sc-for>
    </div>
  </div>
  <span style="padding: 0 24px; text-align: center; font-size: 12px; line-height: 1.4; font-weight: 600; color: {{t.text3}}">On iOS 26 the batch keeps going in the background. On older iOS it may pause until you come back.</span>
  <div style="padding: 10px 20px 30px; display: flex; gap: 10px">
    <a href="CancelConfirm.dc.html" style="flex: none; display: flex; align-items: center; justify-content: center; height: 54px; padding: 0 20px; border-radius: 16px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.danger}}; font-size: 16px; font-weight: 700; text-decoration: none">Stop</a>
    <a href="MyFiles.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: {{t.accent}}; color: {{t.accentText}}; font-size: 16px; font-weight: 800; text-decoration: none">Run in background</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "$preview": {"width": 390, "height": 844}}'>

      dark: { name:'dark', bg: '#0E0D16', surface: '#181626', surface2: '#221F33', border: '#2C2942', divider: '#25223A', text: '#F3F1FF', text2: '#ABA7C6', text3: '#8C88A8', accent: '#6F4EF2', accentText: '#FFFFFF', accentSoft: 'rgba(132,102,255,0.18)', accentOnSoft: '#C4B5FF', link: '#B3A1FF', success: '#3CCB8C', successSoft: 'rgba(60,203,140,0.14)', warn: '#F2B25C', warnSoft: 'rgba(242,178,92,0.14)', danger: '#FF7A68', dangerSoft: 'rgba(255,122,104,0.14)', hero: 'linear-gradient(135deg, #3A22BD 0%, #5537E0 55%, #7A4FFF 100%)', heroText: '#FFFFFF', tab: 'rgba(24,22,38,0.94)', toast: '#2E2A48', shadow: '0 1px 2px rgba(0,0,0,0.3)', scrim: 'rgba(0,0,0,0.64)', gold: '#E0A21B', proBadgeBg: '#F3F1FF', proBadgeText: '#3F25C9' }
    };
    const t = T[this.props.theme === 'dark' ? 'dark' : 'light'];
    const clean = !!this.props.clean && this.props.clean !== 'false';

    const D = [['5230e115aa53f2fe4f1bae4b963f1b53', 'Concert_clip.mov', 'MP3 · 4.2 MB', 'done'], ['dd64327afe25562e1591f48342e293d5', 'Birthday_party.mp4', 'MP3 · 1.9 MB', 'done'], ['905a454bac2434f6af6d86ab906f3d45', 'Beach_day.mov', 'MP3 · 1.4 MB', 'done'], ['d198a3fd0fda1b9001534f72a7d393f6', 'Festival.mov', 'Converting…', 'active'], ['8c521075fc83bb811784b777aa2736b2', 'Guitar_session.mov', 'Waiting', 'wait'], ['d85af57f969ed0047fce7d7f27af3db4', 'Open_mic.mov', 'Waiting', 'wait']];
    const items = D.map((d) => ({ img: '/_blob/' + d[0], name: d[1], meta: d[2], done: d[3] === 'done', active: d[3] === 'active', wait: d[3] === 'wait', border: d[3] === 'active' ? '2px solid ' + t.accent : '1px solid ' + t.border }));
    return { t,  items };

}
</script>
</body>
</html>
