<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif; color: {{t.text}}; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <dc-import name="MyFiles" theme="{{t.name}}" hint-size="390px,844px"></dc-import>
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: {{t.scrim}}; backdrop-filter: blur(10px) saturate(0.9); -webkit-backdrop-filter: blur(10px) saturate(0.9); display: flex; align-items: center; justify-content: center; padding: 0 36px; box-sizing: border-box">
    <div role="alertdialog" aria-label="Delete file?" style="width: 100%; background: {{t.surface}}; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column">
      <div style="padding: 22px 20px 16px; display: flex; flex-direction: column; gap: 8px; text-align: center"><h2 style="margin: 0; font-size: 19px; font-weight: 800">Delete Concert_clip.mp3?</h2><p style="margin: 0; font-size: 14px; line-height: 1.45; color: {{t.text2}}">It’s removed from My files on this iPhone. Copies you saved to your Tunely folder in Files are kept, and the original video in Photos is not touched.</p></div>
      <a href="MyFiles.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-top: 1px solid {{t.divider}}; font-size: 16px; font-weight: 800; color: {{t.danger}}; text-decoration: none">Delete from Tunely</a>
      <a href="MyFiles.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-top: 1px solid {{t.divider}}; font-size: 16px; font-weight: 700; color: {{t.link}}; text-decoration: none">Keep</a>
    </div>
  </div>
</div>
</x-dc>
