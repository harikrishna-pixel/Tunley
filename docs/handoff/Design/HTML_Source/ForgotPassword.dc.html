<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reset password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--accent)}
</style>
</helmet>
<div style="--accent: {{t.accent}}; width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif; color: {{t.text}}; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 12px 4px">
    <a href="SignIn.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{t.text}}">
      <svg width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg>
    </a>
    <div role="radiogroup" aria-label="Preview state" style="display: flex; gap: 4px; padding: 3px; background: {{t.surface2}}; border-radius: 10px">
      <button type="button" onClick="{{showForm}}" style="height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: {{formBg}}; font-family: inherit; font-size: 12px; font-weight: 700; color: {{t.text}}">Form</button>
      <button type="button" onClick="{{showSent}}" style="height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: {{sentBg}}; font-family: inherit; font-size: 12px; font-weight: 700; color: {{t.text}}">Sent</button>
    </div>
  </div>

  <sc-if value="{{isForm}}" hint-placeholder-val="{{ true }}">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 8px 24px 0">
      <div style="width: 56px; height: 56px; border-radius: 16px; background: {{t.accentSoft}}; display: flex; align-items: center; justify-content: center">
        <svg width="28" height="28" viewBox="0 0 256 256" fill="{{t.accent}}" aria-hidden="true"><path d="M216.57,39.43A80,80,0,0,0,83.91,120.78L28.69,176A15.86,15.86,0,0,0,24,187.31V216a16,16,0,0,0,16,16H72a8,8,0,0,0,8-8V208H96a8,8,0,0,0,8-8V184h16a8,8,0,0,0,5.66-2.34l9.56-9.57A79.73,79.73,0,0,0,160,176h.1A80,80,0,0,0,216.57,39.43ZM224,98.1c-1.09,34.09-29.75,61.86-63.89,61.9H160a63.7,63.7,0,0,1-23.65-4.51,8,8,0,0,0-8.84,1.68L116.69,168H96a8,8,0,0,0-8,8v16H72a8,8,0,0,0-8,8v16H40V187.31l58.83-58.82a8,8,0,0,0,1.68-8.84A63.72,63.72,0,0,1,96,95.92c0-34.14,27.81-62.8,61.9-63.89A64,64,0,0,1,224,98.1ZM192,76a12,12,0,1,1-12-12A12,12,0,0,1,192,76Z"></path></svg>
      </div>
      <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Reset your password</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.45; color: {{t.text2}}">Enter the email you signed up with. We’ll send you a link to set a new password.</p>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; font-weight: 600; color: {{t.text2}}">Email</span>
        <input type="email" autocomplete="email" value="anna@example.com" style="height: 50px; padding: 0 14px; border-radius: 14px; border: 2px solid {{t.accent}}; background: {{t.surface}}; font-family: inherit; font-size: 16px; color: {{t.text}}; outline: none">
      </label>
    </div>
    <div style="padding: 12px 24px 34px">
      <button type="button" onClick="{{showSent}}" style="width: 100%; height: 56px; border: 0; border-radius: 16px; background: {{t.accent}}; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700">Send reset link</button>
    </div>
  </sc-if>

  <sc-if value="{{isSent}}" hint-placeholder-val="{{ false }}">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 32px; text-align: center">
      <div style="width: 80px; height: 80px; border-radius: 40px; background: {{t.successSoft}}; display: flex; align-items: center; justify-content: center">
        <svg width="38" height="38" viewBox="0 0 256 256" fill="{{t.success}}" aria-hidden="true"><path d="M224,48H32a8,8,0,0,0-8,8V192a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A8,8,0,0,0,224,48ZM203.43,64,128,133.15,52.57,64ZM216,192H40V74.19l82.59,75.71a8,8,0,0,0,10.82,0L216,74.19V192Z"></path></svg>
      </div>
      <h1 style="margin: 0; font-size: 26px; font-weight: 800">Check your email</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.45; color: {{t.text2}}">If an account exists for <strong style="color: {{t.text}}">anna@example.com</strong>, you’ll get a reset link in a few minutes. Check your spam folder too.</p>
    </div>
    <div style="padding: 12px 24px 34px; display: flex; flex-direction: column; gap: 6px">
      <a href="SignIn.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: {{t.accent}}; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none">Back to sign in</a>
      <button type="button" style="height: 44px; border: 0; background: transparent; font-family: inherit; font-size: 15px; font-weight: 600; color: {{t.text2}}">Resend in 0:45</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"state":{"editor":"enum","options":["form","sent"],"default":"form"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: null };
  }
  renderVals() {
    const T = {
      light: { name:'light', bg: '#F5F4FA', surface: '#FFFFFF', surface2: '#EEECF6', border: '#E5E2F0', divider: '#EFEDF5', text: '#15132B', text2: '#5C5875', text3: '#6B6784', accent: '#5B3FE6', accentText: '#FFFFFF', accentSoft: '#EEEAFF', accentOnSoft: '#3F25C9', link: '#5B3FE6', success: '#0F7350', successSoft: '#E4F4EC', warn: '#9A5A12', warnSoft: '#FDF0DF', danger: '#C2331F', dangerSoft: '#FDECEA', hero: 'linear-gradient(135deg, #3F25C9 0%, #5B3FE6 55%, #7B4DFF 100%)', heroText: '#FFFFFF', tab: 'rgba(255,255,255,0.94)', toast: '#1C1A2E', shadow: '0 1px 2px rgba(21,19,43,0.05), 0 8px 24px rgba(21,19,43,0.06)', scrim: 'rgba(16,12,40,0.52)', gold: '#E0A21B', proBadgeBg: '#15132B', proBadgeText: '#FFD36B' },
      dark: { name:'dark', bg: '#0E0D16', surface: '#181626', surface2: '#221F33', border: '#2C2942', divider: '#25223A', text: '#F3F1FF', text2: '#ABA7C6', text3: '#8C88A8', accent: '#6F4EF2', accentText: '#FFFFFF', accentSoft: 'rgba(132,102,255,0.18)', accentOnSoft: '#C4B5FF', link: '#B3A1FF', success: '#3CCB8C', successSoft: 'rgba(60,203,140,0.14)', warn: '#F2B25C', warnSoft: 'rgba(242,178,92,0.14)', danger: '#FF7A68', dangerSoft: 'rgba(255,122,104,0.14)', hero: 'linear-gradient(135deg, #3A22BD 0%, #5537E0 55%, #7A4FFF 100%)', heroText: '#FFFFFF', tab: 'rgba(24,22,38,0.94)', toast: '#2E2A48', shadow: '0 1px 2px rgba(0,0,0,0.3)', scrim: 'rgba(0,0,0,0.64)', gold: '#E0A21B', proBadgeBg: '#F3F1FF', proBadgeText: '#3F25C9' }
    };
    const t = T[this.props.theme === 'dark' ? 'dark' : 'light'];

    const mode = this.state.mode ?? this.props.state ?? 'form';
    const isSent = mode === 'sent';
    return {
      t,
      isSent, isForm: !isSent,
      formBg: isSent ? 'transparent' : t.surface,
      sentBg: isSent ? t.surface : 'transparent',
      showForm: () => this.setState({ mode: 'form' }),
      showSent: () => this.setState({ mode: 'sent' })
    };
  }
}
</script>
</body>
</html>
