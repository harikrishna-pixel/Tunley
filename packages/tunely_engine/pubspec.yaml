name: tunely_engine
description: On-device audio engine for Tunely. Swift implements it; Kotlin stays a stub until Android.
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: 26.3.4

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: TunelyEnginePlugin
      android:
        package: com.mbxtunely.tunely_engine
        pluginClass: TunelyEnginePlugin
